name: flight-booking

x-db: &db
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
  healthcheck:
    test: [CMD-SHELL, "pg_isready -U app -d app"]
    interval: 2s
    timeout: 2s
    retries: 30

x-sentinel: &sentinel
  image: redis:7.4-alpine
  command:
    - sh
    - -c
    - |
      cp /etc/redis/sentinel.conf /tmp/sentinel.conf
      master_ip=$$(getent hosts redis-master | awk '{print $$1; exit}')
      echo "sentinel monitor flights $$master_ip 6379 2" >> /tmp/sentinel.conf
      exec redis-server /tmp/sentinel.conf --sentinel
  volumes:
    - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
  depends_on:
    redis-master:
      condition: service_healthy
    redis-replica:
      condition: service_healthy
  healthcheck:
    test: [CMD, redis-cli, -p, "26379", ping]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  booking-db:
    <<: *db
    volumes: [booking-data:/var/lib/postgresql/data]

  flight-db:
    <<: *db
    volumes: [flight-data:/var/lib/postgresql/data]

  redis-master:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-master-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-replica:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --replicaof, redis-master, "6379"]
    volumes: [redis-replica-data:/data]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30

  sentinel-1:
    <<: *sentinel
  sentinel-2:
    <<: *sentinel
  sentinel-3:
    <<: *sentinel

  flight:
    build: .
    command: [python, -m, flight.server]
    environment:
      DATABASE_URL: postgresql://app:app@flight-db:5432/app
      GRPC_API_KEY: ${GRPC_API_KEY:-homework-secret}
      REDIS_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_MASTER: flights
      CACHE_TTL: "300"
    healthcheck:
      test: [CMD, python, -c, "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      flight-db:
        condition: service_healthy
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy

  booking:
    build: .
    command: [uvicorn, booking.app:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://app:app@booking-db:5432/app
      FLIGHT_GRPC_TARGET: flight:50051
      GRPC_API_KEY: ${GRPC_API_KEY:-homework-secret}
      GRPC_TIMEOUT: "1"
      CB_FAILURE_THRESHOLD: "5"
      CB_RESET_TIMEOUT: "10"
      CB_WINDOW_SECONDS: "30"
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8000/openapi.json', timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      booking-db:
        condition: service_healthy
      flight:
        condition: service_healthy

volumes:
  booking-data:
  flight-data:
  redis-master-data:
  redis-replica-data:
